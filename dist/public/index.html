<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snoe - Get Key</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'ADLaM Display', cursive;
      background: #050810;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(99, 102, 241, 0.08), transparent);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      font-family: 'ADLaM Display', cursive;
      color: #fff;
      text-align: center;
      margin-bottom: 10px;
      font-size: 2em;
      font-weight: 400;
    }
    
    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      margin-bottom: 30px;
      font-size: 0.95em;
    }
    
    .step {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }
    
    .step.completed {
      border-color: rgba(99, 102, 241, 0.4);
      background: rgba(99, 102, 241, 0.1);
    }
    
    .step.active {
      border-color: rgba(99, 102, 241, 0.3);
      background: rgba(99, 102, 241, 0.05);
    }
    
    .step-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    .step-number {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 0.9em;
    }
    
    .step.completed .step-number {
      background: rgba(99, 102, 241, 0.6);
    }
    
    .step-title {
      color: #fff;
      font-weight: 600;
      font-size: 1.1em;
    }
    
    .checkpoint-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .checkpoint-btn {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-family: 'ADLaM Display', cursive;
      font-size: 1em;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .checkpoint-btn.linkvertise,
    .checkpoint-btn.lootlabs,
    .checkpoint-btn.workink {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #fff;
    }
    
    .checkpoint-btn:hover {
      transform: translateY(-2px);
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
    }
    
    .checkpoint-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .checkpoint-btn.done {
      background: rgba(99, 102, 241, 0.4) !important;
      border-color: rgba(99, 102, 241, 0.6) !important;
    }
    
    .claim-btn {
      width: 100%;
      padding: 16px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 12px;
      color: #fff;
      font-family: 'ADLaM Display', cursive;
      font-size: 1.1em;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    
    .claim-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(99, 102, 241, 0.35);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
    }
    
    .claim-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    .key-display {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
      display: none;
    }
    
    .key-display.show {
      display: block;
    }
    
    .key-label {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    
    .key-value {
      color: #a5b4fc;
      font-size: 1.4em;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      cursor: pointer;
      padding: 10px;
      background: rgba(99, 102, 241, 0.15);
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .key-value:hover {
      background: rgba(99, 102, 241, 0.25);
    }
    
    .copy-hint {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8em;
      margin-top: 10px;
    }
    
    .expires-info {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85em;
      margin-top: 15px;
    }
    
    .status-message {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 0.9em;
      display: none;
    }
    
    .status-message.error {
      display: block;
      background: rgba(255, 71, 87, 0.2);
      color: #ff4757;
    }
    
    .status-message.success {
      display: block;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }
    
    /* Cooldown warning styles */
    .cooldown-warning {
      background: rgba(255, 152, 0, 0.15);
      border: 1px solid rgba(255, 152, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .cooldown-icon {
      font-size: 2em;
      margin-bottom: 10px;
    }
    
    .cooldown-text {
      color: #ffb74d;
      font-size: 0.95em;
      margin-bottom: 8px;
    }
    
    .cooldown-timer {
      color: rgba(255, 183, 77, 0.8);
      font-size: 0.85em;
      font-family: 'Inter', sans-serif;
    }
    
    .progress-text {
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      font-size: 0.85em;
      margin-top: 10px;
    }

    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Mobile Responsive */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      
      .container {
        padding: 24px 20px;
        border-radius: 16px;
      }
      
      h1 {
        font-size: 1.6em;
      }
      
      h1 img {
        width: 28px;
        height: 28px;
      }
      
      .subtitle {
        font-size: 0.85em;
      }
      
      .step {
        padding: 16px;
      }
      
      .step-title {
        font-size: 1em;
      }
      
      .checkpoint-btn {
        padding: 12px 16px;
        font-size: 0.95em;
      }
      
      .claim-btn {
        padding: 14px;
        font-size: 1em;
      }
      
      .key-value {
        font-size: 1.1em;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="display: flex; align-items: center; justify-content: center; gap: 12px;"><img src="/snowflake.png" alt="Snoe" style="width: 36px; height: 36px;">Snoe Project</h1>
    <p class="subtitle">Complete 1 checkpoint to receive your access key</p>
    
    <div class="step active" id="step1">
      <div class="step-header">
        <div class="step-number">1</div>
        <div class="step-title">Complete a Checkpoint</div>
      </div>
      <div class="checkpoint-buttons">
        <button class="checkpoint-btn linkvertise" onclick="startCheckpoint('linkvertise')">
          <span>Linkvertise</span>
        </button>
        <button class="checkpoint-btn lootlabs" onclick="startCheckpoint('lootlabs')">
          <span>Lootlabs</span>
        </button>
        <button class="checkpoint-btn workink" onclick="startCheckpoint('workink')">
          <span>Work.ink</span>
        </button>
      </div>
      <p class="progress-text">Completed: <span id="completedCount">0</span>/1</p>
    </div>
    
    <div class="step" id="step2">
      <div class="step-header">
        <div class="step-number">2</div>
        <div class="step-title">Claim Your Key</div>
      </div>
      <button class="claim-btn" id="claimBtn" onclick="claimKey()" disabled>
        <span id="claimText">Complete Checkpoint First</span>
        <div class="loader" id="claimLoader"></div>
      </button>
    </div>
    
    <div class="key-display" id="keyDisplay">
      <div class="key-label">Your License Key:</div>
      <div class="key-value" id="keyValue" onclick="copyKey()"></div>
      <div class="copy-hint">Click to copy</div>
      <div class="expires-info" id="expiresInfo"></div>
    </div>
    
    <div class="status-message" id="statusMessage"></div>
  </div>

  <script src="/app.js?v=2"></script>
</body>
</html>
