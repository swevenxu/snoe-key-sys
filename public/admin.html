<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snoe - Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'ADLaM Display', cursive;
      background: #050810;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(99, 102, 241, 0.08), transparent);
      min-height: 100vh;
      color: #fff;
    }
    
    /* Login Screen */
    .login-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .login-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .login-box h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.8em;
    }
    
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 1em;
      margin-bottom: 15px;
      font-family: 'ADLaM Display', cursive;
    }
    
    .login-box input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    
    .login-box button {
      width: 100%;
      padding: 14px;
      background: rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(99, 102, 241, 0.5);
      border-radius: 10px;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      font-family: 'ADLaM Display', cursive;
      transition: all 0.3s;
    }
    
    .login-box button:hover {
      background: rgba(99, 102, 241, 0.5);
    }
    
    /* Dashboard */
    .dashboard {
      display: none;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .dashboard.active {
      display: block;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .header h1 {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .header h1 img {
      width: 36px;
      height: 36px;
    }
    
    .logout-btn {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: 'ADLaM Display', cursive;
      transition: all 0.3s;
    }
    
    .logout-btn:hover {
      background: rgba(255, 71, 87, 0.2);
      border-color: rgba(255, 71, 87, 0.4);
    }
    
    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
    }
    
    .stat-card .label {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9em;
      margin-bottom: 8px;
    }
    
    .stat-card .value {
      font-size: 2em;
      color: #a5b4fc;
    }
    
    /* Actions */
    .actions {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    .action-btn {
      padding: 12px 24px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-family: 'ADLaM Display', cursive;
      font-size: 1em;
      transition: all 0.3s;
    }
    
    .action-btn:hover {
      background: rgba(99, 102, 241, 0.4);
    }
    
    .action-btn.danger {
      background: rgba(255, 71, 87, 0.2);
      border-color: rgba(255, 71, 87, 0.4);
    }
    
    .action-btn.danger:hover {
      background: rgba(255, 71, 87, 0.4);
    }
    
    /* Keys Table */
    .keys-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
    }
    
    .keys-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .keys-header h2 {
      font-size: 1.2em;
    }
    
    .search-input {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-family: 'ADLaM Display', cursive;
      width: 250px;
    }
    
    .keys-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .keys-table th,
    .keys-table td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .keys-table th {
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
      font-size: 0.85em;
    }
    
    .keys-table td {
      font-family: 'ADLaM Display', cursive;
      font-size: 0.9em;
    }
    
    .keys-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    
    .key-value {
      color: #a5b4fc;
      font-family: 'Courier New', monospace;
    }
    
    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8em;
    }
    
    .status-badge.active {
      background: rgba(0, 214, 125, 0.2);
      color: #00d67d;
    }
    
    .status-badge.expired {
      background: rgba(255, 71, 87, 0.2);
      color: #ff4757;
    }
    
    .status-badge.revoked {
      background: rgba(255, 165, 0, 0.2);
      color: #ffa500;
    }
    
    .table-action {
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      margin-right: 5px;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    
    .table-action:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .table-action.revoke:hover {
      background: rgba(255, 71, 87, 0.2);
    }
    
    .table-action svg {
      display: block;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: #0a0d14;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
    }
    
    .modal-content h2 {
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9em;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-family: 'ADLaM Display', cursive;
    }
    
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'ADLaM Display', cursive;
      transition: all 0.3s;
    }
    
    .modal-actions .cancel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    
    .modal-actions .submit {
      background: rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #fff;
    }
    
    .modal-actions .submit:hover {
      background: rgba(99, 102, 241, 0.5);
    }
    
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.4);
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 16px 24px;
      background: rgba(99, 102, 241, 0.9);
      border-radius: 10px;
      color: #fff;
      font-family: 'ADLaM Display', cursive;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
    }
    
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    
    .toast.error {
      background: rgba(255, 71, 87, 0.9);
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login-container" id="loginScreen">
    <div class="login-box">
      <h1>Admin Login</h1>
      <input type="password" id="apiKeyInput" placeholder="Enter Admin API Key">
      <button onclick="login()">Login</button>
    </div>
  </div>
  
  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <h1>
        <img src="/snowflake.png" alt="Snoe">
        Snoe Dashboard
      </h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Keys</div>
        <div class="value" id="statTotal">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Active Keys</div>
        <div class="value" id="statActive">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Expired Keys</div>
        <div class="value" id="statExpired">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Validations Today</div>
        <div class="value" id="statToday">-</div>
      </div>
    </div>
    
    <!-- Actions -->
    <div class="actions">
      <button class="action-btn" onclick="openCreateModal()">+ Create Key</button>
      <button class="action-btn" onclick="openBatchModal()">+ Batch Create</button>
      <button class="action-btn" onclick="loadKeys()">↻ Refresh</button>
    </div>
    
    <!-- Keys Table -->
    <div class="keys-section">
      <div class="keys-header">
        <h2>License Keys</h2>
        <input type="text" class="search-input" placeholder="Search keys..." id="searchInput" onkeyup="filterKeys()">
      </div>
      <table class="keys-table">
        <thead>
          <tr>
            <th>Key</th>
            <th>Note</th>
            <th>Status</th>
            <th>Expires</th>
            <th>Uses</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="keysTableBody">
          <tr>
            <td colspan="6" class="empty-state">Loading keys...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <!-- Create Key Modal -->
  <div class="modal" id="createModal">
    <div class="modal-content">
      <h2>Create New Key</h2>
      <div class="form-group">
        <label>Note (optional)</label>
        <input type="text" id="createNote" placeholder="e.g., For user John">
      </div>
      <div class="form-group">
        <label>Duration (days)</label>
        <input type="number" id="createDuration" placeholder="Leave empty for lifetime" min="1">
      </div>
      <div class="form-group">
        <label>Max Uses</label>
        <input type="number" id="createMaxUses" placeholder="Leave empty for unlimited" min="1">
      </div>
      <div class="form-group">
        <label>HWID Resets Allowed</label>
        <input type="number" id="createHwidResets" value="0" min="0">
      </div>
      <div class="modal-actions">
        <button class="cancel" onclick="closeModal('createModal')">Cancel</button>
        <button class="submit" onclick="createKey()">Create Key</button>
      </div>
    </div>
  </div>
  
  <!-- Batch Create Modal -->
  <div class="modal" id="batchModal">
    <div class="modal-content">
      <h2>Batch Create Keys</h2>
      <div class="form-group">
        <label>Number of Keys</label>
        <input type="number" id="batchCount" value="10" min="1" max="100">
      </div>
      <div class="form-group">
        <label>Note (optional)</label>
        <input type="text" id="batchNote" placeholder="e.g., Giveaway batch">
      </div>
      <div class="form-group">
        <label>Duration (days)</label>
        <input type="number" id="batchDuration" placeholder="Leave empty for lifetime" min="1">
      </div>
      <div class="modal-actions">
        <button class="cancel" onclick="closeModal('batchModal')">Cancel</button>
        <button class="submit" onclick="batchCreate()">Create Keys</button>
      </div>
    </div>
  </div>
  
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  
  <script src="/admin.js?v=1"></script>
</body>
</html>
