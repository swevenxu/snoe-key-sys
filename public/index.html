<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snoe - Get Key</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg: #050810;
      --fg: #f0f0f5;
      --brand-400: #818cf8;
      --brand-500: #6366f1;
      --brand-600: #4f46e5;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(99, 102, 241, 0.08), transparent);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      background: rgba(5, 8, 16, 0.8);
    }
    
    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--fg);
      font-family: 'ADLaM Display', cursive;
      font-weight: 400;
      font-size: 1.2em;
    }
    
    .logo-icon {
      width: 32px;
      height: 32px;
    }
    
    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      text-decoration: none;
      font-size: 0.875rem;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    
    .discord-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .discord-btn svg {
      width: 16px;
      height: 16px;
      color: var(--brand-400);
    }
    
    /* Main Container */
    .container {
      width: 100%;
      max-width: 420px;
      margin-top: 40px;
    }
    
    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .title {
      font-family: 'ADLaM Display', cursive;
      font-size: 2.5rem;
      font-weight: 400;
      background: linear-gradient(to bottom, #ffffff, #a0a0a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
    }
    
    .divider-line {
      height: 1px;
      width: 48px;
      background: linear-gradient(to right, transparent, rgba(99, 102, 241, 0.5));
    }
    
    .divider-line:last-child {
      background: linear-gradient(to left, transparent, rgba(99, 102, 241, 0.5));
    }
    
    .divider-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand-500);
    }
    
    .subtitle {
      color: #9ca3af;
      font-size: 1rem;
    }
    
    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(8px);
      margin-bottom: 16px;
    }
    
    .card.completed {
      border-color: rgba(99, 102, 241, 0.3);
    }
    
    .step-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .step-number {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
    }
    
    .card.completed .step-number {
      background: var(--brand-500);
    }
    
    .step-title {
      font-weight: 600;
      font-size: 1rem;
    }
    
    /* Checkpoint Buttons */
    .checkpoint-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .checkpoint-btn {
      width: 100%;
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .checkpoint-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }
    
    .checkpoint-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .checkpoint-btn.done {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
      color: var(--brand-400);
    }
    
    .checkpoint-btn .icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    
    .progress-text {
      color: #6b7280;
      text-align: center;
      font-size: 0.85rem;
      margin-top: 16px;
    }
    
    /* Claim Button */
    .claim-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--brand-500) 0%, var(--brand-600) 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .claim-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
    }
    
    .claim-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.1);
    }
    
    /* Key Display */
    .key-display {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-top: 16px;
      display: none;
    }
    
    .key-display.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .key-label {
      color: #9ca3af;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    
    .key-value {
      color: var(--brand-400);
      font-size: 1.25rem;
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
      word-break: break-all;
      cursor: pointer;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      transition: all 0.2s;
    }
    
    .key-value:hover {
      background: rgba(0, 0, 0, 0.5);
    }
    
    .copy-hint {
      color: #6b7280;
      font-size: 0.75rem;
      margin-top: 12px;
    }
    
    .expires-info {
      color: #9ca3af;
      font-size: 0.85rem;
      margin-top: 12px;
    }
    
    /* Status Message */
    .status-message {
      text-align: center;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 0.875rem;
      display: none;
    }
    
    .status-message.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    
    .status-message.success {
      display: block;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: var(--brand-400);
    }
    
    /* Loader */
    .loader {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Footer */
    .footer {
      margin-top: 32px;
      color: #4b5563;
      font-size: 0.75rem;
      text-align: center;
    }
    
    .footer a {
      color: #6b7280;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .footer a:hover {
      color: var(--brand-400);
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="url(#gradient)" stroke-width="2" fill="none"/>
          <circle cx="16" cy="16" r="6" fill="url(#gradient)"/>
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#818cf8"/>
              <stop offset="100%" style="stop-color:#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
        <span>Snoe</span>
      </a>
      
      <a href="https://discord.gg/your-invite" target="_blank" class="discord-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.317 4.37a19.91 19.91 0 0 0-4.885-1.515.08.08 0 0 0-.085.04c-.211.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.416 0 12.26 12.26 0 0 0-.617-1.25.086.086 0 0 0-.085-.04A19.9 19.9 0 0 0 3.68 4.37a.075.075 0 0 0-.034.03C1.533 7.483.94 10.5 1.145 13.485a.09.09 0 0 0 .033.062 19.98 19.98 0 0 0 5.993 3.013.09.09 0 0 0 .096-.03c.462-.63.874-1.295 1.226-1.99a.086.086 0 0 0-.048-.12c-.652-.248-1.27-.55-1.852-.9a.086.086 0 0 1 .009-.146c.124-.093.248-.19.366-.287a.08.08 0 0 1 .085-.012c3.883 1.772 8.084 1.772 11.932 0a.08.08 0 0 1 .086.011c.118.098.242.195.367.288a.086.086 0 0 1 .009.146c-.584.35-1.2.652-1.853.9a.086.086 0 0 0-.048.12c.36.694.772 1.36 1.225 1.99a.086.086 0 0 0 .096.03 19.94 19.94 0 0 0 6.002-3.013.09.09 0 0 0 .033-.062c.252-2.676-.418-5.674-2.264-8.885a.074.074 0 0 0-.034-.03zM8.02 14.33c-1.183 0-2.157-1.086-2.157-2.42 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.419 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.086-2.157-2.42 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.419 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span>Discord</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="header">
      <h1 class="title">Get Your Key</h1>
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-dot"></div>
        <div class="divider-line"></div>
      </div>
      <p class="subtitle">Complete 1 checkpoint to receive access</p>
    </div>
    
    <div class="card" id="step1">
      <div class="step-header">
        <div class="step-number">1</div>
        <div class="step-title">Complete a Checkpoint</div>
      </div>
      <div class="checkpoint-buttons">
        <button class="checkpoint-btn" onclick="startCheckpoint('linkvertise')">
          <span>Linkvertise</span>
        </button>
        <button class="checkpoint-btn" onclick="startCheckpoint('lootlabs')">
          <span>Lootlabs</span>
        </button>
        <button class="checkpoint-btn" onclick="startCheckpoint('workink')">
          <span>Work.ink</span>
        </button>
      </div>
      <p class="progress-text">Completed: <span id="completedCount">0</span>/1</p>
    </div>
    
    <div class="card" id="step2">
      <div class="step-header">
        <div class="step-number">2</div>
        <div class="step-title">Claim Your Key</div>
      </div>
      <button class="claim-btn" id="claimBtn" onclick="claimKey()" disabled>
        <span id="claimText">Complete Checkpoint First</span>
        <div class="loader" id="claimLoader"></div>
      </button>
    </div>
    
    <div class="key-display" id="keyDisplay">
      <div class="key-label">Your License Key</div>
      <div class="key-value" id="keyValue" onclick="copyKey()"></div>
      <div class="copy-hint">Click to copy</div>
      <div class="expires-info" id="expiresInfo"></div>
    </div>
    
    <div class="status-message" id="statusMessage"></div>
    
    <div class="footer">
      <a href="/">snoe</a> · key system
    </div>
  </div>

  <script>
    const CONFIG = {
      linkvertise: 'https://linkvertise.com/YOUR_ID/your-link',
      lootlabs: 'https://lootlabs.gg/YOUR_LINK',
      workink: 'https://work.ink/YOUR_LINK',
      apiUrl: '',
      requiredCheckpoints: 1,
    };
    
    let sessionToken = null;
    let completedProviders = new Set();
    let hwid = null;
    
    const urlParams = new URLSearchParams(window.location.search);
    hwid = urlParams.get('hwid') || generateVisitorId();
    
    function generateVisitorId() {
      let id = localStorage.getItem('visitor_id');
      if (!id) {
        id = 'web_' + Math.random().toString(36).substr(2, 16);
        localStorage.setItem('visitor_id', id);
      }
      return id;
    }
    
    async function initSession() {
      try {
        const response = await fetch(`${CONFIG.apiUrl}/api/checkpoint/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            visitorId: generateVisitorId(),
            hwid: hwid,
          }),
        });
        
        const data = await response.json();
        if (data.success) {
          sessionToken = data.token;
        }
      } catch (error) {
        console.error('Failed to start session:', error);
        showStatus('Failed to initialize. Please refresh.', 'error');
      }
    }
    
    function startCheckpoint(provider) {
      if (!sessionToken) {
        showStatus('Session not ready. Please wait...', 'error');
        return;
      }
      
      const adUrl = CONFIG[provider];
      if (adUrl && !adUrl.includes('YOUR_')) {
        window.open(adUrl, '_blank');
      }
      
      setTimeout(() => {
        verifyCheckpoint(provider);
      }, 3000);
    }
    
    async function verifyCheckpoint(provider) {
      try {
        const response = await fetch(`${CONFIG.apiUrl}/api/checkpoint/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: sessionToken,
            provider: provider,
          }),
        });
        
        const data = await response.json();
        
        if (data.success) {
          completedProviders = new Set(data.completedProviders);
          updateUI();
          showStatus(`${provider} completed!`, 'success');
          
          const btn = document.querySelector(`.checkpoint-btn[onclick*="${provider}"]`);
          if (btn) {
            btn.classList.add('done');
            btn.innerHTML = '✓ Completed';
            btn.disabled = true;
          }
        }
      } catch (error) {
        showStatus('Verification failed. Try again.', 'error');
      }
    }
    
    function updateUI() {
      const count = completedProviders.size;
      document.getElementById('completedCount').textContent = count;
      
      const claimBtn = document.getElementById('claimBtn');
      const claimText = document.getElementById('claimText');
      
      if (count >= CONFIG.requiredCheckpoints) {
        claimBtn.disabled = false;
        claimText.textContent = 'Claim Your Key';
        document.getElementById('step1').classList.add('completed');
      }
    }
    
    async function claimKey() {
      const claimBtn = document.getElementById('claimBtn');
      const claimText = document.getElementById('claimText');
      const claimLoader = document.getElementById('claimLoader');
      
      claimBtn.disabled = true;
      claimText.textContent = 'Claiming...';
      claimLoader.style.display = 'inline-block';
      
      try {
        const response = await fetch(`${CONFIG.apiUrl}/api/checkpoint/claim`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: sessionToken }),
        });
        
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('keyValue').textContent = data.key;
          document.getElementById('expiresInfo').textContent = `Expires in: ${data.expiresIn}`;
          document.getElementById('keyDisplay').classList.add('show');
          document.getElementById('step2').classList.add('completed');
          claimText.textContent = 'Key Claimed!';
          showStatus('Key generated successfully!', 'success');
        } else {
          throw new Error(data.error || 'Failed to claim key');
        }
      } catch (error) {
        showStatus(error.message || 'Failed to claim. Try again.', 'error');
        claimBtn.disabled = false;
        claimText.textContent = 'Try Again';
      }
      
      claimLoader.style.display = 'none';
    }
    
    function copyKey() {
      const key = document.getElementById('keyValue').textContent;
      navigator.clipboard.writeText(key).then(() => {
        showStatus('Key copied to clipboard!', 'success');
      });
    }
    
    function showStatus(message, type) {
      const statusEl = document.getElementById('statusMessage');
      statusEl.textContent = message;
      statusEl.className = 'status-message ' + type;
      
      setTimeout(() => {
        statusEl.className = 'status-message';
      }, 5000);
    }
    
    initSession();
  </script>
</body>
</html>
